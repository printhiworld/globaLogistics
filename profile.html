<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет | GlobalLogistics</title>
    <style>
        /* --- Базовые настройки (как на главной) --- */
        :root {
            --primary-color: #0f2c59;
            --secondary-color: #1a428a;
            --accent-color: #d35400;
            --bg-color: #f4f6f8;
            --text-dark: #333;
            --text-light: #777;
            --white: #ffffff;
            --success: #27ae60;
            --warning: #f39c12;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            min-height: 100vh;
        }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        /* --- Сайдбар (Боковое меню) --- */
        .sidebar {
            width: 280px;
            background-color: var(--primary-color);
            color: var(--white);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100%;
            left: 0;
            top: 0;
            transition: all 0.3s;
        }

        .sidebar-header {
            padding: 30px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }
        .logo span { color: var(--accent-color); }

        .user-mini-profile {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background-color: var(--secondary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .user-info h4 { font-size: 0.95rem; }
        .user-info p { font-size: 0.8rem; opacity: 0.7; }

        .sidebar-menu {
            padding: 20px 0;
            flex: 1;
        }

        .menu-item {
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: rgba(255,255,255,0.8);
            transition: 0.3s;
            cursor: pointer;
        }

        .menu-item:hover, .menu-item.active {
            background-color: var(--secondary-color);
            color: var(--white);
            border-left: 4px solid var(--accent-color);
        }

        .logout-btn {
            margin: 20px;
            padding: 12px;
            background-color: rgba(0,0,0,0.2);
            text-align: center;
            border-radius: 5px;
            color: #ff6b6b;
            font-weight: 600;
            transition: 0.3s;
            cursor: pointer;
        }

        .logout-btn:hover {
            background-color: rgba(0,0,0,0.4);
            color: #ff4757;
        }

        /* --- Основной контент --- */
        .main-content {
            margin-left: 280px; /* Отступ под сайдбар */
            flex: 1;
            padding: 40px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-title h1 {
            color: var(--primary-color);
            font-size: 2rem;
        }

        /* --- Профиль (карточка) --- */
        .profile-card {
            background: var(--white);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .profile-details h3 { margin-bottom: 10px; }
        .profile-details p { color: var(--text-light); margin-bottom: 5px; }
        
        .btn-edit {
            padding: 10px 20px;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            border-radius: 5px;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-edit:hover {
            background-color: var(--primary-color);
            color: var(--white);
        }

        /* --- Фильтры заказов --- */
        .orders-section {
            background: var(--white);
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .orders-header {
            padding: 20px 30px;
            border-bottom: 1px solid #eee;
            display: flex;
            gap: 20px;
        }

        .filter-btn {
            background: none;
            border: none;
            font-size: 1rem;
            color: var(--text-light);
            cursor: pointer;
            padding-bottom: 5px;
            position: relative;
        }

        .filter-btn.active {
            color: var(--primary-color);
            font-weight: bold;
        }

        .filter-btn.active::after {
            content: '';
            position: absolute;
            bottom: -21px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--accent-color);
        }

        /* --- Список заказов --- */
        .order-list {
            padding: 0;
        }

        .order-item {
            border-bottom: 1px solid #eee;
            padding: 20px 30px;
            transition: 0.3s;
        }

        .order-item:last-child { border-bottom: none; }
        .order-item:hover { background-color: #fafafa; }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-info {
            display: flex;
            gap: 20px;
        }

        .order-id {
            font-weight: bold;
            color: var(--primary-color);
        }

        .order-route {
            color: var(--text-dark);
        }

        .order-date {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-active { background-color: #e8f8f5; color: var(--success); }
        .status-transit { background-color: #fef9e7; color: var(--warning); }
        .status-done { background-color: #f2f4f6; color: var(--text-light); }

        .order-actions {
            margin-top: 15px;
            display: flex;
            justify-content: flex-end;
        }

        .btn-details {
            color: var(--primary-color);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            background: none;
            border: none;
        }
        .btn-details:hover { text-decoration: underline; }

        /* --- Детали заказа (скрыты по умолчанию) --- */
        .order-details {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            background-color: #fcfcfc;
            padding: 20px;
            border-radius: 5px;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .order-details.show {
            display: grid;
        }

        .detail-block h5 {
            color: var(--text-light);
            font-size: 0.85rem;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .detail-block p {
            font-weight: 500;
        }

        /* --- Адаптивность --- */
        @media (max-width: 768px) {
            .sidebar { width: 70px; }
            .sidebar-header h2, .user-info, .menu-item span, .logout-btn span { display: none; }
            .sidebar-header, .menu-item, .logout-btn { justify-content: center; padding: 15px 0; }
            .main-content { margin-left: 70px; padding: 20px; }
            .profile-card { flex-direction: column; text-align: center; gap: 20px; }
            .order-top { flex-direction: column; align-items: flex-start; gap: 10px; }
            .order-details { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Сайдбар -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">Global<span>Logistics</span></div>
            <div class="user-mini-profile">
                <div class="avatar">ИИ</div>
                <div class="user-info">
                    <h4>Иван Иванов</h4>
                    <p>Менеджер ВЭД</p>
                </div>
            </div>
        </div>

        <ul class="sidebar-menu">
            <li class="menu-item active">
                <span>📊</span> <span>Мои заказы</span>
            </li>
            <li class="menu-item">
                <span>👤</span> <span>Профиль</span>
            </li>
            <li class="menu-item">
                <span>📄</span> <span>Документы</span>
            </li>
            <li class="menu-item">
                <span>⚙️</span> <span>Настройки</span>
            </li>
        </ul>

        <div class="logout-btn" onclick="logout()">
            <span>🚪</span> <span>Выйти</span>
        </div>
    </aside>

    <!-- Основной контент -->
    <main class="main-content">
        
        <div class="page-header">
            <div class="page-title">
                <h1>Личный кабинет</h1>
            </div>
        </div>

        <!-- Карточка профиля (кратко) -->
        <section class="profile-card">
            <div class="profile-details">
                <h3>Иван Иванов</h3>
                <p>Компания: ООО "ТрансЛогистик"</p>
                <p>Email: ivan@translogistic.ru</p>
                <p>Телефон: +7 (999) 000-00-00</p>
            </div>
            <button class="btn-edit">Редактировать профиль</button>
        </section>

        <!-- Секция заказов -->
        <section class="orders-section">
            <div class="orders-header">
                <button class="filter-btn active" onclick="filterOrders('current', this)">Текущие</button>
                <button class="filter-btn" onclick="filterOrders('history', this)">История</button>
            </div>

            <div class="order-list" id="orderList">
                <!-- Заказы будут загружены через JS -->
            </div>
        </section>

    </main>

    <script>
        // Данные заказов (имитация базы данных)
        const ordersData = [
            {
                id: "GL-2023-001",
                type: "current",
                route: "Шанхай (Китай) — Москва (РФ)",
                date: "10.10.2023",
                status: "В пути",
                statusClass: "status-transit",
                details: {
                    weight: "1200 кг",
                    cargo: "Электроника (бытовая)",
                    eta: "25.10.2023",
                    manager: "Петров А.С."
                }
            },
            {
                id: "GL-2023-005",
                type: "current",
                route: "Санкт-Петербург — Казань",
                date: "12.10.2023",
                status: "Оформление",
                statusClass: "status-active",
                details: {
                    weight: "500 кг",
                    cargo: "Строительные материалы",
                    eta: "15.10.2023",
                    manager: "Сидорова Е.В."
                }
            },
            {
                id: "GL-2023-089",
                type: "history",
                route: "Берлин (Германия) — Новосибирск",
                date: "01.09.2023",
                status: "Доставлено",
                statusClass: "status-done",
                details: {
                    weight: "2500 кг",
                    cargo: "Запчасти для авто",
                    eta: "15.09.2023",
                    manager: "Петров А.С."
                }
            },
            {
                id: "GL-2023-042",
                type: "history",
                route: "Москва — Владивосток",
                date: "15.08.2023",
                status: "Доставлено",
                statusClass: "status-done",
                details: {
                    weight: "800 кг",
                    cargo: "Одежда",
                    eta: "25.08.2023",
                    manager: "Иванов И.И."
                }
            }
        ];

        // Функция рендера заказов
        function renderOrders(filterType) {
            const listContainer = document.getElementById('orderList');
            listContainer.innerHTML = ''; // Очистка списка

            const filteredOrders = ordersData.filter(order => order.type === filterType);

            if (filteredOrders.length === 0) {
                listContainer.innerHTML = '<div style="padding:30px; text-align:center; color:#999;">Заказов не найдено</div>';
                return;
            }

            filteredOrders.forEach(order => {
                const itemHTML = `
                    <div class="order-item">
                        <div class="order-top">
                            <div class="order-info">
                                <span class="order-id">#${order.id}</span>
                                <span class="order-route">${order.route}</span>
                            </div>
                            <div style="text-align: right;">
                                <span class="status-badge ${order.statusClass}">${order.status}</span>
                                <div class="order-date">${order.date}</div>
                            </div>
                        </div>
                        <div class="order-actions">
                            <button class="btn-details" onclick="toggleDetails('${order.id}')">
                                Показать детали ▼
                            </button>
                        </div>
                        <div class="order-details" id="details-${order.id}">
                            <div class="detail-block">
                                <h5>Вес груза</h5>
                                <p>${order.details.weight}</p>
                            </div>
                            <div class="detail-block">
                                <h5>Описание груза</h5>
                                <p>${order.details.cargo}</p>
                            </div>
                            <div class="detail-block">
                                <h5>Плановая дата (ETA)</h5>
                                <p>${order.details.eta}</p>
                            </div>
                            <div class="detail-block">
                                <h5>Менеджер</h5>
                                <p>${order.details.manager}</p>
                            </div>
                        </div>
                    </div>
                `;
                listContainer.innerHTML += itemHTML;
            });
        }

        // Фильтрация
        function filterOrders(type, btnElement) {
            // Обновляем активную кнопку
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            
            // Перерисовываем список
            renderOrders(type);
        }

        // Развернуть детали
        function toggleDetails(id) {
            const detailsBlock = document.getElementById(`details-${id}`);
            const btn = document.querySelector(`button[onclick="toggleDetails('${id}')"]`);
            
            if (detailsBlock.classList.contains('show')) {
                detailsBlock.classList.remove('show');
                btn.innerHTML = 'Показать детали ▼';
            } else {
                detailsBlock.classList.add('show');
                btn.innerHTML = 'Скрыть детали ▲';
            }
        }

        // Выход из системы
        function logout() {
            if(confirm('Вы уверены, что хотите выйти?')) {
                // В реальности здесь был бы вызов API для уничтожения сессии
                window.location.href = 'login.html'; // Перенаправление на страницу входа
            }
        }

        // Инициализация при загрузке (показываем текущие заказы)
        document.addEventListener('DOMContentLoaded', () => {
            renderOrders('current');
        });

    </script>
</body>
</html>
